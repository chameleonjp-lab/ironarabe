name: Publish Codeberg Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'VERIFY for dry run, PUBLISH for actual publish'
        required: true
        type: string
      dry_run:
        description: 'Verify connection and push permission without writing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-codeberg-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEBERG_REPOSITORY: https://codeberg.org/chameleonjp/ironarabe.git
      PUBLIC_BASE_URL: https://chameleonjp.codeberg.page/ironarabe
      PUBLIC_RELEASE_URL: https://chameleonjp.codeberg.page/ironarabe/release.json
      EXPECTED_GAME_SLUG: ironarabe
      EXPECTED_CLIENT_VERSION: ironarabe-web-1.2.0-official001-v2
      EXPECTED_CHALLENGE_ID: ironarabe-official-001
      EXPECTED_BOARD_VERSION: '2'
      EXPECTED_SOURCE_INDEX_BLOB: 34924ded8610a300e76dca6b7890a6799ded3645
      EXPECTED_SHUFFLE_SEED: ironarabe-official-001-v1
      PUBLIC_VERIFY_ATTEMPTS: '18'
      PUBLIC_VERIFY_INTERVAL_SECONDS: '20'

    steps:
      - name: Validate manual confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            [[ "${{ inputs.confirmation }}" == "VERIFY" ]] || {
              echo 'Dry run requires confirmation=VERIFY.'
              exit 1
            }
          else
            [[ "${{ inputs.confirmation }}" == "PUBLISH" ]] || {
              echo 'Publishing requires confirmation=PUBLISH.'
              exit 1
            }
          fi

      - name: Check out the publish-only branch
        uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0

      - name: Validate publish contents
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f release.json
          test -f tools/difficulty-core.js
          test -f tools/difficulty-lab.html
          test ! -e README.md
          test ! -e RELEASE_READINESS_v1.md
          test ! -d .github
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const expected = {
            game_slug: process.env.EXPECTED_GAME_SLUG,
            client_version: process.env.EXPECTED_CLIENT_VERSION,
            challenge_id: process.env.EXPECTED_CHALLENGE_ID,
            board_version: Number(process.env.EXPECTED_BOARD_VERSION),
            source_index_blob: process.env.EXPECTED_SOURCE_INDEX_BLOB
          };
          for (const [key, value] of Object.entries(expected)) {
            if (release[key] !== value) {
              throw new Error(`release.json ${key} mismatch: ${release[key]}`);
            }
          }
          const index = fs.readFileSync('index.html', 'utf8');
          const required = [
            '<title>イロナラベ</title>',
            `CLIENT_VERSION='${process.env.EXPECTED_CLIENT_VERSION}'`,
            `CHALLENGE_ID='${process.env.EXPECTED_CHALLENGE_ID}'`,
            `SHUFFLE_SEED='${process.env.EXPECTED_SHUFFLE_SEED}'`
          ];
          for (const value of required) {
            if (!index.includes(value)) throw new Error(`index.html missing ${value}`);
          }
          NODE

      - name: Configure Codeberg HTTPS authentication
        shell: bash
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CODEBERG_USERNAME:-}" || {
            echo 'Missing repository secret: CODEBERG_USERNAME'
            exit 1
          }
          test -n "${CODEBERG_TOKEN:-}" || {
            echo 'Missing repository secret: CODEBERG_TOKEN'
            exit 1
          }

          askpass="$RUNNER_TEMP/codeberg-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "$CODEBERG_USERNAME" ;;
            *Password*) printf '%s\n' "$CODEBERG_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          echo "GIT_ASKPASS=$askpass" >> "$GITHUB_ENV"
          echo 'GIT_TERMINAL_PROMPT=0' >> "$GITHUB_ENV"

      - name: Verify Codeberg repository access
        shell: bash
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          git remote add codeberg "$CODEBERG_REPOSITORY"
          git ls-remote codeberg HEAD >/dev/null
          echo 'Codeberg repository access verified.'

      - name: Show planned update
        shell: bash
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote codeberg refs/heads/pages | awk '{print $1}')"
          echo "LOCAL_PAGES_SHA=$local_sha" >> "$GITHUB_ENV"
          echo "REMOTE_PAGES_SHA=$remote_sha" >> "$GITHUB_ENV"
          echo "GitHub pages SHA: $local_sha"
          echo "Codeberg pages SHA: ${remote_sha:-<not-created>}"

      - name: Verify push permission without writing
        if: ${{ inputs.dry_run == true }}
        shell: bash
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$REMOTE_PAGES_SHA" ]]; then
            git push --dry-run --force-with-lease="refs/heads/pages:$REMOTE_PAGES_SHA" codeberg HEAD:pages
          else
            git push --dry-run codeberg HEAD:pages
          fi
          {
            echo '## Codeberg Pages dry run'
            echo
            echo '- Repository access: verified'
            echo '- Push permission: verified without writing'
            echo "- GitHub pages SHA: \`$LOCAL_PAGES_SHA\`"
            echo "- Codeberg pages SHA: \`${REMOTE_PAGES_SHA:-not-created}\`"
            echo '- Supabase: unchanged and must remain inactive'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pages branch to Codeberg
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$REMOTE_PAGES_SHA" ]]; then
            git push --force-with-lease="refs/heads/pages:$REMOTE_PAGES_SHA" codeberg HEAD:pages
          else
            git push codeberg HEAD:pages
          fi
          echo 'Codeberg pages branch updated.'

      - name: Verify Codeberg pages branch SHA
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          published_sha="$(git ls-remote codeberg refs/heads/pages | awk '{print $1}')"
          [[ "$published_sha" == "$LOCAL_PAGES_SHA" ]] || {
            echo "Codeberg pages SHA mismatch: expected $LOCAL_PAGES_SHA, got ${published_sha:-<missing>}"
            exit 1
          }
          echo 'Codeberg pages branch SHA verified.'

      - name: Wait for public Codeberg Pages version
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          release_file="$RUNNER_TEMP/ironarabe-release.json"
          index_file="$RUNNER_TEMP/ironarabe-index.html"
          verified=false

          verify_files() {
            node - "$release_file" "$index_file" <<'NODE'
          const fs = require('fs');
          const releasePath = process.argv[2];
          const indexPath = process.argv[3];
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const index = fs.readFileSync(indexPath, 'utf8');
          const expected = {
            game_slug: process.env.EXPECTED_GAME_SLUG,
            client_version: process.env.EXPECTED_CLIENT_VERSION,
            challenge_id: process.env.EXPECTED_CHALLENGE_ID,
            board_version: Number(process.env.EXPECTED_BOARD_VERSION),
            source_index_blob: process.env.EXPECTED_SOURCE_INDEX_BLOB
          };
          for (const [key, value] of Object.entries(expected)) {
            if (release[key] !== value) {
              throw new Error(`public release.json ${key} mismatch: ${release[key]}`);
            }
          }
          const required = [
            '<title>イロナラベ</title>',
            `CLIENT_VERSION='${process.env.EXPECTED_CLIENT_VERSION}'`,
            `CHALLENGE_ID='${process.env.EXPECTED_CHALLENGE_ID}'`,
            `SHUFFLE_SEED='${process.env.EXPECTED_SHUFFLE_SEED}'`
          ];
          for (const value of required) {
            if (!index.includes(value)) throw new Error(`public index.html missing ${value}`);
          }
          NODE
          }

          for attempt in $(seq 1 "$PUBLIC_VERIFY_ATTEMPTS"); do
            cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            echo "Public verification attempt $attempt/$PUBLIC_VERIFY_ATTEMPTS"
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "${PUBLIC_RELEASE_URL}?verify=${cache_bust}" \
              --output "$release_file" \
              && curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "${PUBLIC_BASE_URL}/?verify=${cache_bust}" \
              --output "$index_file" \
              && verify_files; then
              verified=true
              break
            fi

            if [[ "$attempt" -lt "$PUBLIC_VERIFY_ATTEMPTS" ]]; then
              sleep "$PUBLIC_VERIFY_INTERVAL_SECONDS"
            fi
          done

          [[ "$verified" == "true" ]] || {
            echo 'Public Codeberg Pages did not reach the expected version.'
            echo 'Check the Codeberg repository, pages branch, Pages webhook, and cache invalidation.'
            exit 1
          }

          {
            echo '## Codeberg Pages publication verified'
            echo
            echo "- Public URL: $PUBLIC_BASE_URL/"
            echo "- Release metadata: $PUBLIC_RELEASE_URL"
            echo "- Client version: \`$EXPECTED_CLIENT_VERSION\`"
            echo "- Challenge ID: \`$EXPECTED_CHALLENGE_ID\`"
            echo "- Board version: \`$EXPECTED_BOARD_VERSION\`"
            echo "- Source index blob: \`$EXPECTED_SOURCE_INDEX_BLOB\`"
            echo "- Published pages SHA: \`$LOCAL_PAGES_SHA\`"
            echo '- iPhone Safari operation: still requires human confirmation'
            echo '- Supabase: unchanged and must remain inactive until the iPhone gate passes'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Supabase inactive reminder
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'This workflow does not enable Supabase.'
          echo 'Confirm the public URL and iPhone operation before setting public.games.is_active=true.'
