{
  "name": "Legacy Codeberg publication notice",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "jobs": {
    "notice": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 1,
      "steps": [
        {
          "name": "Explain retired publisher",
          "run": "printf '%s\\n' 'Codeberg publishing is retired. The existing site is unchanged. Use the GitHub Pages workflow after merging into the default branch.'"
        }
      ]
    }
  }
}
