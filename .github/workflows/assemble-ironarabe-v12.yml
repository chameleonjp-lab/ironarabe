name: Assemble ironarabe v12 payload

on:
  push:
    branches:
      - agent/ironarabe-ranking-result-v12
    paths:
      - '_upload-v12/**'
      - '.github/workflows/assemble-ironarabe-v12.yml'

permissions:
  contents: write

concurrency:
  group: assemble-ironarabe-v12
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: agent/ironarabe-ranking-result-v12
          fetch-depth: 0

      - name: Decode and verify index
        shell: bash
        run: |
          set -euo pipefail
          test "$(find _upload-v12 -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "9"
          cat _upload-v12/part-* | base64 --decode > index.html.next
          echo '4cdc98cce8a46edc061dbb3011526e2d646fce5c0d1ea7aa5eca59d256f9a862  index.html.next' | sha256sum -c -
          mv index.html.next index.html
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              "CLIENT_VERSION='ironarabe-web-1.3.0-official001-v2'",
              'CLEAR_BOARD_DISPLAY_MS=4000',
              'RANKING_LIMIT=30',
              'id="homeRankingList"',
              'id="resultRankingList"',
              'get_best_score_ranking',
              'この名前の記録',
              '操作回数',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing required content: {missing}')
          if '移動回数' in text:
              raise SystemExit('old wording remains')
          PY

      - name: Commit assembled index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index.html already assembled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add ranking and result record UI'
          git push origin HEAD:agent/ironarabe-ranking-result-v12
