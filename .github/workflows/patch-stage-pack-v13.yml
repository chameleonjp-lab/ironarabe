name: Patch ironarabe stage pack v13

on:
  pull_request:
    branches:
      - claude/ironarabe-new-game-wlys30
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-stage-pack-v13.yml'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: patch-stage-pack-v13
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/ironarabe-stage-pack-v13' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ironarabe-stage-pack-v13
          fetch-depth: 0

      - name: Patch stage pack and home spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if new in text and old not in text:
                  print(f'already patched: {label}')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)
              print(f'patched: {label}')

          replace_once(
              "  .btn-row .btn { margin-top:10px; }\n",
              "  .btn-row .btn { margin-top:10px; }\n"
              "  .home-actions { display:grid; gap:8px; margin:2px 0 12px; }\n"
              "  .home-actions .btn { margin-top:0; padding:13px 14px; }\n"
              "  .home-share-btn { margin-top:0; padding:13px 14px; }\n"
              "  .stage-note { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 9px; margin:-6px 0 12px; color:var(--muted); font-size:12px; }\n"
              "  .stage-note strong { color:var(--text); font-size:12px; letter-spacing:.04em; }\n"
              "  .stage-dots { display:flex; gap:3px; }\n"
              "  .stage-dots i { display:block; width:9px; height:9px; border-radius:3px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }\n",
              'home action CSS')

          replace_once(
              "  .countdown-value { font-size:72px; font-weight:900; letter-spacing:.08em; color:var(--accent); text-shadow:0 0 22px rgba(127,215,196,.18); }\n",
              "  .countdown-value { font-size:72px; font-weight:900; letter-spacing:.08em; color:var(--accent); text-shadow:0 0 22px rgba(127,215,196,.18); }\n"
              "  .countdown-stage { margin-top:12px; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.08em; }\n",
              'countdown stage CSS')

          replace_once(
              "  .hud .stat .v { font-size:20px; line-height:1.15; font-weight:700; font-variant-numeric:tabular-nums; }\n",
              "  .hud .stat .v { font-size:20px; line-height:1.15; font-weight:700; font-variant-numeric:tabular-nums; }\n"
              "  .hud .stat.stage-stat { flex:.72; }\n"
              "  .hud .stat.stage-stat .v { font-size:14px; line-height:1.32; letter-spacing:.02em; }\n",
              'stage HUD CSS')

          replace_once(
              "  .record-line .label { color:var(--muted); font-size:13px; }\n",
              "  .record-line .label { color:var(--muted); font-size:13px; }\n"
              "  .record-line .val.stage-value { max-width:58%; overflow:hidden; text-overflow:ellipsis; font-size:14px; }\n",
              'result stage CSS')

          replace_once(
              "    .record-line .label { font-size:12px; }\n",
              "    .record-line .label { font-size:12px; }\n"
              "    .hud .stat.stage-stat { flex:.6; }\n"
              "    .hud .stat.stage-stat .v { font-size:12px; }\n",
              'narrow stage CSS')

          replace_once(
              "    <button class=\"btn\" id=\"startBtn\">ゲームを始める</button>\n    <button class=\"btn secondary\" id=\"howToBtn\" aria-expanded=\"false\" aria-controls=\"howToPanel\">遊び方</button>\n",
              "    <div class=\"stage-note\"><span class=\"stage-dots\" id=\"stagePackDots\" aria-hidden=\"true\"></span><strong>全8ステージ</strong><span>毎回ランダム</span></div>\n"
              "    <div class=\"home-actions\">\n"
              "      <button class=\"btn\" id=\"startBtn\">ゲームを始める</button>\n"
              "      <button class=\"btn secondary\" id=\"howToBtn\" aria-expanded=\"false\" aria-controls=\"howToPanel\">遊び方</button>\n"
              "    </div>\n",
              'home actions HTML')

          replace_once(
              "        <li>タイム計測はカウントダウン後に始まる</li>\n",
              "        <li>タイム計測はカウントダウン後に始まる</li>\n"
              "        <li>全8ステージから毎回1つが選ばれる</li>\n",
              'how-to stage item')

          replace_once(
              "    <button class=\"btn secondary\" id=\"homeShareBtn\">ゲームをシェア</button>\n",
              "    <button class=\"btn secondary home-share-btn\" id=\"homeShareBtn\">ゲームをシェア</button>\n",
              'home share spacing')

          replace_once(
              "    <div class=\"countdown-value\" id=\"countdownValue\" aria-live=\"assertive\">3</div>\n",
              "    <div class=\"countdown-value\" id=\"countdownValue\" aria-live=\"assertive\">3</div>\n"
              "    <div class=\"countdown-stage\" id=\"countdownStage\">STAGE 1 / 8</div>\n",
              'countdown stage HTML')

          replace_once(
              "      <div class=\"stat\"><div class=\"k\">操作回数</div><div class=\"v\" id=\"operationDisplay\">0</div></div>\n",
              "      <div class=\"stat\"><div class=\"k\">操作回数</div><div class=\"v\" id=\"operationDisplay\">0</div></div>\n"
              "      <div class=\"stat stage-stat\"><div class=\"k\">STAGE</div><div class=\"v\" id=\"stageDisplay\">1 / 8</div></div>\n",
              'stage HUD HTML')

          replace_once(
              "      <div class=\"record-line\"><span class=\"label\">操作回数</span><span class=\"val\" id=\"resultOperations\">0回</span></div>\n",
              "      <div class=\"record-line\"><span class=\"label\">ステージ</span><span class=\"val stage-value\" id=\"resultStage\">--</span></div>\n"
              "      <div class=\"record-line\"><span class=\"label\">操作回数</span><span class=\"val\" id=\"resultOperations\">0回</span></div>\n",
              'result stage HTML')

          replace_once(
              "  const GAME_SLUG='ironarabe', CHALLENGE_ID='ironarabe-official-001', BOARD_VERSION=2, CLIENT_VERSION='ironarabe-web-1.3.0-official001-v2';\n",
              "  const GAME_SLUG='ironarabe', CHALLENGE_ID='ironarabe-official-001', BOARD_VERSION=2, CLIENT_VERSION='ironarabe-web-1.4.0-stagepack001-v2';\n",
              'client version')

          replace_once(
              "  const OFFICIAL_CHALLENGE={id:CHALLENGE_ID,topLeft:'#f36b6b',topRight:'#f0c46a',bottomLeft:'#7b6ff0',bottomRight:'#5fd0b5'};\n",
              "  const STAGE_ROTATION_NAMES=['0°','90°','180°','270°'];\n"
              "  const STAGE_PALETTES=[\n"
              "    {id:'sunset',name:'夕映え',corners:['#f36b6b','#f0c46a','#5fd0b5','#7b6ff0']},\n"
              "    {id:'aurora',name:'極光',corners:['#6bf3f3','#6a96f0','#d05f7a','#e4f06f']}\n"
              "  ];\n"
              "  const STAGES=buildStages();\n",
              'stage constants')

          replace_once(
              "    phase:'home', inputLocked:false, playerName:'', tiles:[], solution:[], board:[], fixedSet:new Set(),\n",
              "    phase:'home', inputLocked:false, playerName:'', stage:null, stageBag:[], lastStageIndex:null, tiles:[], solution:[], board:[], fixedSet:new Set(),\n",
              'stage state')

          replace_once(
              "    logoChips:document.getElementById('logoChips'), startBtn:document.getElementById('startBtn'),\n",
              "    logoChips:document.getElementById('logoChips'), stagePackDots:document.getElementById('stagePackDots'), startBtn:document.getElementById('startBtn'),\n",
              'stage dots element')

          replace_once(
              "    countdownValue:document.getElementById('countdownValue'), board:document.getElementById('board'),\n",
              "    countdownValue:document.getElementById('countdownValue'), countdownStage:document.getElementById('countdownStage'), board:document.getElementById('board'),\n",
              'countdown stage element')

          replace_once(
              "    timeDisplay:document.getElementById('timeDisplay'), operationDisplay:document.getElementById('operationDisplay'),\n",
              "    timeDisplay:document.getElementById('timeDisplay'), operationDisplay:document.getElementById('operationDisplay'), stageDisplay:document.getElementById('stageDisplay'),\n",
              'HUD stage element')

          replace_once(
              "    resultOperations:document.getElementById('resultOperations'), bestBadge:document.getElementById('bestBadge'),\n",
              "    resultOperations:document.getElementById('resultOperations'), resultStage:document.getElementById('resultStage'), bestBadge:document.getElementById('bestBadge'),\n",
              'result stage element')

          validate_line = "  function validateName(value){const name=normalizeName(value),len=countGraphemes(name);if(len<1)return {ok:false,message:'プレイヤー名を1文字以上入力してください。'};if(len>20)return {ok:false,message:'プレイヤー名は20文字以内にしてください。'};return {ok:true,name:name};}\n"
          stage_functions = validate_line + (
              "  function rotateCornersClockwise(corners,steps){const normalized=((steps%4)+4)%4;return corners.map(function(_,index){return corners[(index-normalized+4)%4];});}\n"
              "  function buildStages(){const stages=[];STAGE_PALETTES.forEach(function(palette){for(let rotation=0;rotation<4;rotation++){const corners=rotateCornersClockwise(palette.corners,rotation),number=stages.length+1,id=palette.id+'-r'+rotation;stages.push({id:id,number:number,paletteId:palette.id,paletteName:palette.name,rotation:rotation,rotationLabel:STAGE_ROTATION_NAMES[rotation],challenge:{id:CHALLENGE_ID+'-'+id,topLeft:corners[0],topRight:corners[1],bottomRight:corners[2],bottomLeft:corners[3]}});}});return stages;}\n"
              "  function randomInt(max){if(max<=1)return 0;if(globalThis.crypto&&typeof globalThis.crypto.getRandomValues==='function'){const values=new Uint32Array(1);globalThis.crypto.getRandomValues(values);return values[0]%max;}return Math.floor(Math.random()*max);}\n"
              "  function refillStageBag(){const bag=STAGES.map(function(_,index){return index;});for(let i=bag.length-1;i>0;i--){const j=randomInt(i+1),tmp=bag[i];bag[i]=bag[j];bag[j]=tmp;}if(bag.length>1&&state.lastStageIndex!==null&&bag[0]===state.lastStageIndex){const tmp=bag[0];bag[0]=bag[1];bag[1]=tmp;}state.stageBag=bag;}\n"
              "  function stageShortLabel(stage){return stage?stage.number+' / '+STAGES.length:'-- / '+STAGES.length;}\n"
              "  function stageLongLabel(stage){return stage?stage.paletteName+' '+stage.rotationLabel:'--';}\n"
              "  function currentClientVersion(){return CLIENT_VERSION+'-'+(state.stage?state.stage.id:'unknown');}\n"
              "  function updateStageUi(){const shortLabel=stageShortLabel(state.stage),longLabel=stageLongLabel(state.stage);el.stageDisplay.textContent=shortLabel;el.stageDisplay.title=longLabel;el.countdownStage.textContent='STAGE '+shortLabel+'・'+longLabel;el.resultStage.textContent=longLabel+' ('+shortLabel+')';}\n"
              "  function chooseNextStage(){if(state.stageBag.length===0)refillStageBag();const index=state.stageBag.shift();state.stage=STAGES[index];state.lastStageIndex=index;updateStageUi();return state.stage;}\n"
          )
          replace_once(validate_line, stage_functions, 'stage functions')

          replace_once("initFixedSet();state.tiles=buildTiles(OFFICIAL_CHALLENGE);", "initFixedSet();chooseNextStage();state.tiles=buildTiles(state.stage.challenge);", 'prepare stage')
          replace_once("el.completionSummary.textContent=formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回';", "el.completionSummary.textContent='STAGE '+stageShortLabel(state.stage)+'・'+formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回';", 'completion stage')
          replace_once("clientVersion:CLIENT_VERSION,at:Date.now()", "stageId:state.stage?state.stage.id:null,stageLabel:stageLongLabel(state.stage),clientVersion:currentClientVersion(),at:Date.now()", 'local stage result')
          replace_once("el.resultOperations.textContent=String(state.operations)+'回';setPhase('result');", "el.resultOperations.textContent=String(state.operations)+'回';updateStageUi();setPhase('result');", 'result stage update')
          replace_once("p_client_version:CLIENT_VERSION", "p_client_version:currentClientVersion()", 'stage client version')
          replace_once("  function shareHome(){shareText('イロナラベ\\n色の流れを見ながら、7×9のタイルを正しい場所へ並べよう。\\n'+GAME_URL,'home');}\n", "  function shareHome(){shareText('イロナラベ\\n全8ステージから毎回ランダム。色の流れを見ながら、7×9のタイルを正しい場所へ並べよう。\\n'+GAME_URL,'home');}\n", 'home share')
          replace_once("  function shareResult(){shareText('イロナラベ\\n公式チャレンジを'+formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回でクリア！\\n'+GAME_URL,'result');}\n", "  function shareResult(){shareText('イロナラベ\\nSTAGE '+stageShortLabel(state.stage)+'「'+stageLongLabel(state.stage)+'」を'+formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回でクリア！\\n'+GAME_URL,'result');}\n", 'result share')
          replace_once("  function buildLogoChips(){[OFFICIAL_CHALLENGE.topLeft,OFFICIAL_CHALLENGE.topRight,OFFICIAL_CHALLENGE.bottomRight,OFFICIAL_CHALLENGE.bottomLeft].forEach(function(hex){const s=document.createElement('span');s.style.background=hex;el.logoChips.appendChild(s);});}\n", "  function buildLogoChips(){STAGE_PALETTES.flatMap(function(palette){return palette.corners;}).forEach(function(hex){const s=document.createElement('span');s.style.background=hex;el.logoChips.appendChild(s);});}\n  function buildStagePackDots(){STAGE_PALETTES.flatMap(function(palette){return palette.corners;}).forEach(function(hex){const dot=document.createElement('i');dot.style.background=hex;el.stagePackDots.appendChild(dot);});}\n", 'stage chips')
          replace_once("  buildLogoChips();\n  migrateOldStorage();\n", "  buildLogoChips();\n  buildStagePackDots();\n  migrateOldStorage();\n", 'stage dots initialization')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched game
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error('expected one inline script');
          new Function(scripts[0][1]);
          const required=[
            "CLIENT_VERSION='ironarabe-web-1.4.0-stagepack001-v2'",
            "const STAGES=buildStages()",
            "name:'夕映え'",
            "name:'極光'",
            "corners:['#6bf3f3','#6a96f0','#d05f7a','#e4f06f']",
            "chooseNextStage();state.tiles=buildTiles(state.stage.challenge)",
            "SHUFFLE_SEED='ironarabe-official-001-v1'",
            "id=\"stagePackDots\"",
            "id=\"countdownStage\"",
            "id=\"stageDisplay\"",
            "id=\"resultStage\"",
            "home-actions",
            "currentClientVersion()"
          ];
          for(const needle of required){if(!html.includes(needle))throw new Error('missing '+needle);}
          if(html.includes('OFFICIAL_CHALLENGE')) throw new Error('single-stage challenge remains');
          NODE

      - name: Commit patched game
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Stage pack already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add eight rotating color stages'
          git push origin HEAD:agent/ironarabe-stage-pack-v13
