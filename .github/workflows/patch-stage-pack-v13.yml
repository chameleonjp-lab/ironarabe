name: Patch ironarabe stage pack v13

on:
  pull_request:
    branches:
      - claude/ironarabe-new-game-wlys30
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-stage-pack-v13.yml'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: patch-stage-pack-v13
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/ironarabe-stage-pack-v13' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ironarabe-stage-pack-v13
          fetch-depth: 0

      - name: Patch stage pack and home spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f'{label}: expected one old block, found {count}')

          replace_once(
          """  .btn-row { display:flex; gap:10px; margin-top:0; }
          .btn-row .btn { margin-top:10px; }
          .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
          """,
          """  .btn-row { display:flex; gap:10px; margin-top:0; }
          .btn-row .btn { margin-top:10px; }
          .home-actions { display:grid; gap:8px; margin:2px 0 12px; }
          .home-actions .btn { margin-top:0; padding:13px 14px; }
          .home-share-btn { margin-top:0; padding:13px 14px; }
          .stage-note { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 9px; margin:-6px 0 12px; color:var(--muted); font-size:12px; }
          .stage-note strong { color:var(--text); font-size:12px; letter-spacing:.04em; }
          .stage-dots { display:flex; gap:3px; }
          .stage-dots i { display:block; width:9px; height:9px; border-radius:3px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }
          .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
          """,
          'home action CSS')

          replace_once(
          """  .countdown-screen { align-items:center; justify-content:center; text-align:center; min-height:70dvh; }
          .countdown-value { font-size:72px; font-weight:900; letter-spacing:.08em; color:var(--accent); text-shadow:0 0 22px rgba(127,215,196,.18); }

          .hud { display:flex; gap:8px; margin-bottom:7px; }
          """,
          """  .countdown-screen { align-items:center; justify-content:center; text-align:center; min-height:70dvh; }
          .countdown-value { font-size:72px; font-weight:900; letter-spacing:.08em; color:var(--accent); text-shadow:0 0 22px rgba(127,215,196,.18); }
          .countdown-stage { margin-top:12px; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.08em; }

          .hud { display:flex; gap:8px; margin-bottom:7px; }
          """,
          'countdown stage CSS')

          replace_once(
          """  .hud .stat .k { font-size:10px; color:var(--muted); letter-spacing:.12em; line-height:1.2; }
          .hud .stat .v { font-size:20px; line-height:1.15; font-weight:700; font-variant-numeric:tabular-nums; }
          .board-wrap { display:flex; justify-content:center; flex:1; min-height:0; align-items:center; position:relative; }
          """,
          """  .hud .stat .k { font-size:10px; color:var(--muted); letter-spacing:.12em; line-height:1.2; }
          .hud .stat .v { font-size:20px; line-height:1.15; font-weight:700; font-variant-numeric:tabular-nums; }
          .hud .stat.stage-stat { flex:.72; }
          .hud .stat.stage-stat .v { font-size:14px; line-height:1.32; letter-spacing:.02em; }
          .board-wrap { display:flex; justify-content:center; flex:1; min-height:0; align-items:center; position:relative; }
          """,
          'stage HUD CSS')

          replace_once(
          """  .record-line .label { color:var(--muted); font-size:13px; }
          .record-status { min-height:18px; margin-top:8px; color:var(--muted); font-size:11px; line-height:1.5; }
          """,
          """  .record-line .label { color:var(--muted); font-size:13px; }
          .record-line .val.stage-value { max-width:58%; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
          .record-status { min-height:18px; margin-top:8px; color:var(--muted); font-size:11px; line-height:1.5; }
          """,
          'result stage CSS')

          replace_once(
          """    .record-line .label { font-size:12px; }
              .ranking-row { grid-template-columns:36px minmax(0,1fr) auto; padding-left:10px; padding-right:10px; }
          """,
          """    .record-line .label { font-size:12px; }
              .hud .stat.stage-stat { flex:.6; }
              .hud .stat.stage-stat .v { font-size:12px; }
              .ranking-row { grid-template-columns:36px minmax(0,1fr) auto; padding-left:10px; padding-right:10px; }
          """,
          'narrow stage HUD CSS')

          replace_once(
          """    <p class="lead">色の流れを見ながら、7×9のタイルを正しい場所へ並べ直すタイムアタックです。</p>
              <button class="btn" id="startBtn">ゲームを始める</button>
              <button class="btn secondary" id="howToBtn" aria-expanded="false" aria-controls="howToPanel">遊び方</button>
          """,
          """    <p class="lead">色の流れを見ながら、7×9のタイルを正しい場所へ並べ直すタイムアタックです。</p>
              <div class="stage-note"><span class="stage-dots" id="stagePackDots" aria-hidden="true"></span><strong>全8ステージ</strong><span>毎回ランダム</span></div>
              <div class="home-actions">
                <button class="btn" id="startBtn">ゲームを始める</button>
                <button class="btn secondary" id="howToBtn" aria-expanded="false" aria-controls="howToPanel">遊び方</button>
              </div>
          """,
          'home actions HTML')

          replace_once(
          """        <li>タイム計測はカウントダウン後に始まる</li>
              </ol>
          """,
          """        <li>タイム計測はカウントダウン後に始まる</li>
                <li>全8ステージから毎回1つが選ばれる</li>
              </ol>
          """,
          'how-to stage item')

          replace_once(
          """    <button class="btn secondary" id="homeShareBtn">ゲームをシェア</button>
          """,
          """    <button class="btn secondary home-share-btn" id="homeShareBtn">ゲームをシェア</button>
          """,
          'home share spacing')

          replace_once(
          """  <section id="screen-countdown" class="screen countdown-screen">
              <div class="countdown-value" id="countdownValue" aria-live="assertive">3</div>
            </section>
          """,
          """  <section id="screen-countdown" class="screen countdown-screen">
              <div class="countdown-value" id="countdownValue" aria-live="assertive">3</div>
              <div class="countdown-stage" id="countdownStage">STAGE 1 / 8</div>
            </section>
          """,
          'countdown stage HTML')

          replace_once(
          """      <div class="stat"><div class="k">TIME</div><div class="v" id="timeDisplay">0.00</div></div>
                <div class="stat"><div class="k">操作回数</div><div class="v" id="operationDisplay">0</div></div>
          """,
          """      <div class="stat"><div class="k">TIME</div><div class="v" id="timeDisplay">0.00</div></div>
                <div class="stat"><div class="k">操作回数</div><div class="v" id="operationDisplay">0</div></div>
                <div class="stat stage-stat"><div class="k">STAGE</div><div class="v" id="stageDisplay">1 / 8</div></div>
          """,
          'stage HUD HTML')

          replace_once(
          """      <div class="record-line"><span class="label">この名前のプレイ回数</span><span class="val" id="namePlayCountDisplay">--回</span></div>
                <div class="record-line"><span class="label">操作回数</span><span class="val" id="resultOperations">0回</span></div>
          """,
          """      <div class="record-line"><span class="label">この名前のプレイ回数</span><span class="val" id="namePlayCountDisplay">--回</span></div>
                <div class="record-line"><span class="label">ステージ</span><span class="val stage-value" id="resultStage">--</span></div>
                <div class="record-line"><span class="label">操作回数</span><span class="val" id="resultOperations">0回</span></div>
          """,
          'result stage HTML')

          replace_once(
          """  const GAME_SLUG='ironarabe', CHALLENGE_ID='ironarabe-official-001', BOARD_VERSION=2, CLIENT_VERSION='ironarabe-web-1.3.0-official001-v2';
            const SCORE_SCALE=100, SCORE_DECIMALS=2, SCORE_SUBMIT_TIMEOUT_MS=10000, RANKING_FETCH_TIMEOUT_MS=10000;
            const COUNTDOWN_STEP_MS=700, COUNTDOWN_START_MS=300, SWAP_ANIMATION_MS=140, CLEAR_BOARD_DISPLAY_MS=4000, RANKING_LIMIT=30;
            const GAME_URL='https://chameleonjp.codeberg.page/ironarabe/';
            const LAB_URL='https://chameleonjp.codeberg.page/chameleonjp_lab/';
            const OFFICIAL_CHALLENGE={id:CHALLENGE_ID,topLeft:'#f36b6b',topRight:'#f0c46a',bottomLeft:'#7b6ff0',bottomRight:'#5fd0b5'};
            const SHUFFLE_SEED='ironarabe-official-001-v1';
          """,
          """  const GAME_SLUG='ironarabe', CHALLENGE_ID='ironarabe-official-001', BOARD_VERSION=2, CLIENT_VERSION='ironarabe-web-1.4.0-stagepack001-v2';
            const SCORE_SCALE=100, SCORE_DECIMALS=2, SCORE_SUBMIT_TIMEOUT_MS=10000, RANKING_FETCH_TIMEOUT_MS=10000;
            const COUNTDOWN_STEP_MS=700, COUNTDOWN_START_MS=300, SWAP_ANIMATION_MS=140, CLEAR_BOARD_DISPLAY_MS=4000, RANKING_LIMIT=30;
            const GAME_URL='https://chameleonjp.codeberg.page/ironarabe/';
            const LAB_URL='https://chameleonjp.codeberg.page/chameleonjp_lab/';
            const STAGE_ROTATION_NAMES=['0°','90°','180°','270°'];
            const STAGE_PALETTES=[
              {id:'sunset',name:'夕映え',corners:['#f36b6b','#f0c46a','#5fd0b5','#7b6ff0']},
              {id:'aurora',name:'極光',corners:['#6bf3f3','#6a96f0','#d05f7a','#e4f06f']}
            ];
            const STAGES=buildStages();
            const SHUFFLE_SEED='ironarabe-official-001-v1';
          """,
          'stage constants')

          replace_once(
          """    phase:'home', inputLocked:false, playerName:'', tiles:[], solution:[], board:[], fixedSet:new Set(),
              selectedIndex:null, operations:0, startTime:null, elapsedMs:0, cleared:false, playId:0,
          """,
          """    phase:'home', inputLocked:false, playerName:'', stage:null, stageBag:[], lastStageIndex:null, tiles:[], solution:[], board:[], fixedSet:new Set(),
              selectedIndex:null, operations:0, startTime:null, elapsedMs:0, cleared:false, playId:0,
          """,
          'stage state')

          replace_once(
          """    logoChips:document.getElementById('logoChips'), startBtn:document.getElementById('startBtn'),
          """,
          """    logoChips:document.getElementById('logoChips'), stagePackDots:document.getElementById('stagePackDots'), startBtn:document.getElementById('startBtn'),
          """,
          'stage dots element')

          replace_once(
          """    countdownValue:document.getElementById('countdownValue'), board:document.getElementById('board'),
              timeDisplay:document.getElementById('timeDisplay'), operationDisplay:document.getElementById('operationDisplay'),
          """,
          """    countdownValue:document.getElementById('countdownValue'), countdownStage:document.getElementById('countdownStage'), board:document.getElementById('board'),
              timeDisplay:document.getElementById('timeDisplay'), operationDisplay:document.getElementById('operationDisplay'), stageDisplay:document.getElementById('stageDisplay'),
          """,
          'stage play elements')

          replace_once(
          """    resultOperations:document.getElementById('resultOperations'), bestBadge:document.getElementById('bestBadge'),
          """,
          """    resultOperations:document.getElementById('resultOperations'), resultStage:document.getElementById('resultStage'), bestBadge:document.getElementById('bestBadge'),
          """,
          'result stage element')

          replace_once(
          """  function validateName(value){const name=normalizeName(value),len=countGraphemes(name);if(len<1)return {ok:false,message:'プレイヤー名を1文字以上入力してください。'};if(len>20)return {ok:false,message:'プレイヤー名は20文字以内にしてください。'};return {ok:true,name:name};}
            function migrateOldStorage(){
          """,
          """  function validateName(value){const name=normalizeName(value),len=countGraphemes(name);if(len<1)return {ok:false,message:'プレイヤー名を1文字以上入力してください。'};if(len>20)return {ok:false,message:'プレイヤー名は20文字以内にしてください。'};return {ok:true,name:name};}
            function rotateCornersClockwise(corners,steps){const normalized=((steps%4)+4)%4;return corners.map(function(_,index){return corners[(index-normalized+4)%4];});}
            function buildStages(){const stages=[];STAGE_PALETTES.forEach(function(palette){for(let rotation=0;rotation<4;rotation++){const corners=rotateCornersClockwise(palette.corners,rotation),number=stages.length+1,id=palette.id+'-r'+rotation;stages.push({id:id,number:number,paletteId:palette.id,paletteName:palette.name,rotation:rotation,rotationLabel:STAGE_ROTATION_NAMES[rotation],challenge:{id:CHALLENGE_ID+'-'+id,topLeft:corners[0],topRight:corners[1],bottomRight:corners[2],bottomLeft:corners[3]}});}});return stages;}
            function randomInt(max){if(max<=1)return 0;if(globalThis.crypto&&typeof globalThis.crypto.getRandomValues==='function'){const values=new Uint32Array(1);globalThis.crypto.getRandomValues(values);return values[0]%max;}return Math.floor(Math.random()*max);}
            function refillStageBag(){const bag=STAGES.map(function(_,index){return index;});for(let i=bag.length-1;i>0;i--){const j=randomInt(i+1),tmp=bag[i];bag[i]=bag[j];bag[j]=tmp;}if(bag.length>1&&state.lastStageIndex!==null&&bag[0]===state.lastStageIndex){const tmp=bag[0];bag[0]=bag[1];bag[1]=tmp;}state.stageBag=bag;}
            function stageShortLabel(stage){return stage?stage.number+' / '+STAGES.length:'-- / '+STAGES.length;}
            function stageLongLabel(stage){return stage?stage.paletteName+' '+stage.rotationLabel:'--';}
            function currentClientVersion(){return CLIENT_VERSION+'-'+(state.stage?state.stage.id:'unknown');}
            function updateStageUi(){const shortLabel=stageShortLabel(state.stage),longLabel=stageLongLabel(state.stage);el.stageDisplay.textContent=shortLabel;el.stageDisplay.title=longLabel;el.countdownStage.textContent='STAGE '+shortLabel+'・'+longLabel;el.resultStage.textContent=longLabel+' ('+shortLabel+')';}
            function chooseNextStage(){if(state.stageBag.length===0)refillStageBag();const index=state.stageBag.shift();state.stage=STAGES[index];state.lastStageIndex=index;updateStageUi();return state.stage;}
            function migrateOldStorage(){
          """,
          'stage functions')

          replace_once(
          """function preparePlay(){stopTimer();clearPendingTimers();hideCompletion();el.retireBtn.disabled=true;initFixedSet();state.tiles=buildTiles(OFFICIAL_CHALLENGE);const s=shuffledBoard();
          """,
          """function preparePlay(){stopTimer();clearPendingTimers();hideCompletion();el.retireBtn.disabled=true;initFixedSet();chooseNextStage();state.tiles=buildTiles(state.stage.challenge);const s=shuffledBoard();
          """,
          'prepare stage')

          replace_once(
          """    el.completionSummary.textContent=formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回';
          """,
          """    el.completionSummary.textContent='STAGE '+stageShortLabel(state.stage)+'・'+formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回';
          """,
          'completion stage label')

          replace_once(
          """  function updateLocalResult(playerName,elapsedMs,operations){const score=elapsedMsToScore(elapsedMs),r=loadLocalRecords();if(!r.firstScore)safeStorageSet(LS.firstScore,String(score));if(!r.bestScore||score<r.bestScore)safeStorageSet(LS.bestScore,String(score));safeStorageSet(LS.lastResult,JSON.stringify({playerName,elapsedMs,score,operations,challengeId:CHALLENGE_ID,boardVersion:BOARD_VERSION,clientVersion:CLIENT_VERSION,at:Date.now()}));}
          """,
          """  function updateLocalResult(playerName,elapsedMs,operations){const score=elapsedMsToScore(elapsedMs),r=loadLocalRecords();if(!r.firstScore)safeStorageSet(LS.firstScore,String(score));if(!r.bestScore||score<r.bestScore)safeStorageSet(LS.bestScore,String(score));safeStorageSet(LS.lastResult,JSON.stringify({playerName,elapsedMs,score,operations,challengeId:CHALLENGE_ID,stageId:state.stage?state.stage.id:null,stageLabel:stageLongLabel(state.stage),boardVersion:BOARD_VERSION,clientVersion:currentClientVersion(),at:Date.now()}));}
          """,
          'local stage result')

          replace_once(
          """  function showResult(playId){if(playId!==state.playId||state.resultShownPlayId===playId)return;clearToast('home');hideCompletion();el.retireBtn.disabled=true;state.resultShownPlayId=playId;const score=elapsedMsToScore(state.elapsedMs);el.resultTime.innerHTML=formatScore(score)+'<span style="font-size:22px;">秒</span>';el.resultOperations.textContent=String(state.operations)+'回';setPhase('result');loadRankings(false);refreshHomeRecords();}
          """,
          """  function showResult(playId){if(playId!==state.playId||state.resultShownPlayId===playId)return;clearToast('home');hideCompletion();el.retireBtn.disabled=true;state.resultShownPlayId=playId;const score=elapsedMsToScore(state.elapsedMs);el.resultTime.innerHTML=formatScore(score)+'<span style="font-size:22px;">秒</span>';el.resultOperations.textContent=String(state.operations)+'回';updateStageUi();setPhase('result');loadRankings(false);refreshHomeRecords();}
          """,
          'result stage refresh')

          replace_once(
          """const payload={p_display_name:playerName,p_game_slug:GAME_SLUG,p_score:score,p_client_version:CLIENT_VERSION};
          """,
          """const payload={p_display_name:playerName,p_game_slug:GAME_SLUG,p_score:score,p_client_version:currentClientVersion()};
          """,
          'stage client version')

          replace_once(
          """  function shareHome(){shareText('イロナラベ\n色の流れを見ながら、7×9のタイルを正しい場所へ並べよう。\n'+GAME_URL,'home');}
            function shareResult(){shareText('イロナラベ\n公式チャレンジを'+formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回でクリア！\n'+GAME_URL,'result');}
            function buildLogoChips(){[OFFICIAL_CHALLENGE.topLeft,OFFICIAL_CHALLENGE.topRight,OFFICIAL_CHALLENGE.bottomRight,OFFICIAL_CHALLENGE.bottomLeft].forEach(function(hex){const s=document.createElement('span');s.style.background=hex;el.logoChips.appendChild(s);});}
          """,
          """  function shareHome(){shareText('イロナラベ\n全8ステージから毎回ランダム。色の流れを見ながら、7×9のタイルを正しい場所へ並べよう。\n'+GAME_URL,'home');}
            function shareResult(){shareText('イロナラベ\nSTAGE '+stageShortLabel(state.stage)+'「'+stageLongLabel(state.stage)+'」を'+formatElapsedMs(state.elapsedMs)+'秒・操作'+state.operations+'回でクリア！\n'+GAME_URL,'result');}
            function buildLogoChips(){STAGE_PALETTES.flatMap(function(palette){return palette.corners;}).forEach(function(hex){const s=document.createElement('span');s.style.background=hex;el.logoChips.appendChild(s);});}
            function buildStagePackDots(){STAGE_PALETTES.flatMap(function(palette){return palette.corners;}).forEach(function(hex){const dot=document.createElement('i');dot.style.background=hex;el.stagePackDots.appendChild(dot);});}
          """,
          'stage share and chips')

          replace_once(
          """  buildLogoChips();
            migrateOldStorage();
          """,
          """  buildLogoChips();
            buildStagePackDots();
            migrateOldStorage();
          """,
          'stage dots initialization')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched game
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error('expected one inline script');
          new Function(scripts[0][1]);
          const required=[
            "CLIENT_VERSION='ironarabe-web-1.4.0-stagepack001-v2'",
            "const STAGES=buildStages()",
            "name:'夕映え'",
            "name:'極光'",
            "corners:['#6bf3f3','#6a96f0','#d05f7a','#e4f06f']",
            "chooseNextStage();state.tiles=buildTiles(state.stage.challenge)",
            "SHUFFLE_SEED='ironarabe-official-001-v1'",
            "id=\"stagePackDots\"",
            "id=\"countdownStage\"",
            "id=\"stageDisplay\"",
            "id=\"resultStage\"",
            "home-actions",
            "currentClientVersion()"
          ];
          for(const needle of required){if(!html.includes(needle))throw new Error('missing '+needle);}
          if((html.match(/name:'夕映え'/g)||[]).length!==1)throw new Error('sunset palette duplicated');
          if((html.match(/name:'極光'/g)||[]).length!==1)throw new Error('aurora palette duplicated');
          NODE
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          if text.count('id="stageDisplay"') != 1:
              raise SystemExit('stageDisplay id count mismatch')
          if text.count('id="resultStage"') != 1:
              raise SystemExit('resultStage id count mismatch')
          if 'OFFICIAL_CHALLENGE' in text:
              raise SystemExit('single-stage challenge remains')
          PY

      - name: Commit patched game
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Stage pack already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add eight rotating color stages'
          git push origin HEAD:agent/ironarabe-stage-pack-v13
