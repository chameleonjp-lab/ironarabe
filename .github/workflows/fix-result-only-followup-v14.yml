name: Fix result-only followup v14

on:
  pull_request:
    branches:
      - claude/ironarabe-new-game-wlys30
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fix-result-only-followup-v14.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/ironarabe-result-ranking-only-v14' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ironarabe-result-ranking-only-v14
          fetch-depth: 0
      - name: Remove stale local-record reference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          old="el.resultOperations.textContent=String(state.operations)+'回';updateStageUi();setPhase('result');loadRankings(false);refreshHomeRecords();"
          new="el.resultOperations.textContent=String(state.operations)+'回';updateStageUi();setPhase('result');loadRankings(false);"
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('showResult block not found')
          old_cache="state.stage=null;state.tiles=[];state.solution=[];state.board=[];state.selectedIndex=null;"
          new_cache="state.stage=null;state.tiles=[];state.solution=[];state.board=[];state.fixedSet=new Set();state.selectedIndex=null;"
          if old_cache in text:
              text=text.replace(old_cache,new_cache,1)
          elif new_cache not in text:
              raise SystemExit('replay cache block not found')
          path.write_text(text,encoding='utf-8')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const script=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)][0]?.[1];
          if(!script) throw new Error('inline script missing');
          new Function(script);
          if(html.includes('refreshHomeRecords')) throw new Error('stale local record reference remains');
          if(!html.includes('state.fixedSet=new Set()')) throw new Error('fixedSet cache is not cleared');
          NODE
      - name: Commit followup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Followup already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove stale local record reference'
          git push origin HEAD:agent/ironarabe-result-ranking-only-v14
