name: Patch result-only ranking v14

on:
  pull_request:
    branches:
      - claude/ironarabe-new-game-wlys30
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-result-ranking-only-v14.yml'
      - 'tools/patch-result-ranking-only-v14.py'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: patch-result-ranking-only-v14
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/ironarabe-result-ranking-only-v14' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ironarabe-result-ranking-only-v14
          fetch-depth: 0

      - name: Patch index
        run: python tools/patch-result-ranking-only-v14.py

      - name: Verify safe patch baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error('expected one inline script');
          new Function(scripts[0][1]);
          for(const value of [
            "CLIENT_VERSION='ironarabe-web-1.4.1-stagepack001-v2'",
            '登録名のベスト記録',
            'id="resultRankingList"',
            "function replay(){clearReplayCachePreserveName();openNameConfirm();}",
            'clearStorageNamespace(localStorage)',
            'clearStorageNamespace(sessionStorage)'
          ]){
            if(!html.includes(value))throw new Error('missing '+value);
          }
          for(const value of [
            'id="homeRankingList"',
            'id="homeRankingStatus"',
            'id="homeRankingScroll"',
            'id="homeBest"',
            'この端末のベスト記録'
          ]){
            if(html.includes(value))throw new Error('forbidden '+value);
          }
          NODE

      - name: Commit patched index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Index already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'perf: defer ranking to result and clear replay cache'
          git push origin HEAD:agent/ironarabe-result-ranking-only-v14
