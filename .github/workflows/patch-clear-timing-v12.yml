name: Patch immediate clear timing v12

on:
  pull_request:
    branches:
      - claude/ironarabe-new-game-wlys30
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-clear-timing-v12.yml'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: patch-clear-timing-v12
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/ironarabe-ranking-result-v12' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ironarabe-ranking-result-v12
          fetch-depth: 0
      - name: Patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_finish = "function finishSwap(playId,a,b){state.swapTimerId=null;const aEl=el.board.children[a],bEl=el.board.children[b];if(aEl)aEl.classList.remove('swapping');if(bEl)bEl.classList.remove('swapping');if(playId!==state.playId||state.phase!=='playing'||state.cleared)return;if(checkCleared()){onClear();return;}state.inputLocked=false;}"
          new_finish = "function finishSwap(playId,a,b){state.swapTimerId=null;const aEl=el.board.children[a],bEl=el.board.children[b];if(aEl)aEl.classList.remove('swapping');if(bEl)bEl.classList.remove('swapping');if(playId!==state.playId||state.phase!=='playing'||state.cleared)return;state.inputLocked=false;}"
          old_select = "state.operations+=1;\n    el.operationDisplay.textContent=String(state.operations);\n    const aEl=el.board.children[a],bEl=el.board.children[b];"
          new_select = "state.operations+=1;\n    el.operationDisplay.textContent=String(state.operations);\n    if(checkCleared()){onClear();return;}\n    const aEl=el.board.children[a],bEl=el.board.children[b];"
          if old_finish in text:
              text = text.replace(old_finish, new_finish, 1)
          elif new_finish not in text:
              raise SystemExit('finishSwap contract not found')
          if old_select in text:
              text = text.replace(old_select, new_select, 1)
          elif new_select not in text:
              raise SystemExit('selectTile clear checkpoint not found')
          path.write_text(text, encoding='utf-8')
          if text.index('if(checkCleared()){onClear();return;}') > text.index('const aEl=el.board.children[a],bEl=el.board.children[b];', text.index('function selectTile')):
              raise SystemExit('clear checkpoint is not before final swap animation')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const script=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)][0]?.[1];
          if(!script) throw new Error('inline script missing');
          new Function(script);
          NODE
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Immediate clear timing already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: stop timer on the solving operation'
          git push origin HEAD:agent/ironarabe-ranking-result-v12
