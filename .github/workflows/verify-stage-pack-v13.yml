name: Verify ironarabe stage pack v13

on:
  pull_request:
    branches:
      - claude/ironarabe-new-game-wlys30
    types: [opened, synchronize, reopened]
    paths:
      - 'index.html'
      - 'README.md'
      - 'SPEC_v4.md'
      - 'REVIEW_CHECKLIST_v4.md'
      - 'RELEASE_STATUS_v3.md'
      - 'tools/verify-production-ui.cjs'
      - 'tools/verify-ranking-ui-v12.cjs'
      - 'tools/verify-stage-pack-v13.cjs'
      - 'tools/verify-release-contract.cjs'
      - '.github/workflows/verify-stage-pack-v13.yml'

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.head_ref == 'agent/ironarabe-stage-pack-v13' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ironarabe-stage-pack-v13

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/verify-production-ui.cjs
          node --check tools/verify-ranking-ui-v12.cjs
          node --check tools/verify-stage-pack-v13.cjs
          node --check tools/verify-release-contract.cjs
          node --check tools/verify-codeberg-publish-workflow.cjs
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error(`expected one inline script, got ${scripts.length}`);
          new Function(scripts[0][1]);
          const ids=[...html.matchAll(/\sid="([^"]+)"/g)].map((match)=>match[1]);
          if(new Set(ids).size!==ids.length) throw new Error('duplicate HTML id');
          NODE

      - name: Run static contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-production-ui.cjs
          node tools/verify-ranking-ui-v12.cjs
          node tools/verify-stage-pack-v13.cjs
          node tools/verify-release-contract.cjs
          node tools/verify-codeberg-publish-workflow.cjs

      - name: Verify no temporary patch assets remain
        shell: bash
        run: |
          set -euo pipefail
          test ! -e _upload-v12
          test ! -e .github/workflows/patch-stage-pack-v13.yml
          test ! -e .github/workflows/patch-clear-timing-v12.yml
          test ! -e .github/workflows/assemble-ironarabe-v12.yml
